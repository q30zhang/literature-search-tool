project:
  type: website
  output-dir: docs
  pre-render:
    - python3 scripts/build-bib-manifest.py
  resources:
    - data_bibtex/*.bib
    - literature_data/*.json

# PDF links are generated as:
# <pdf-parent-dir>/<bib-file-name-without-extension>/<article-title-with-spaces-as-underscores>.pdf
# BibTeX title "--" sequences are converted to en dashes for local PDF filenames.
literature:
  pdf-parent-dir: http://localhost:4000

website:
  title: "Literature Collections - Truck Platooning Control"
  navbar:
    right:
      - href: literatures_list.qmd
        text: List of Literatures
      - href: about.qmd
        text: About
  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
